<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業版業務案件記錄與管理系統</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        h2 { margin: 0; color: var(--text-main); font-size: 22px; display: flex; align-items: center; gap: 8px; }
        .nav-btns button {
            padding: 8px 18px;
            margin-left: 8px;
            cursor: pointer;
            background-color: #e2e8f0;
            color: #475569;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .nav-btns button.active {
            background-color: var(--primary);
            color: white;
        }
        .container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .view-section { display: none; }
        .view-section.active { display: block; }
        
        /* 統計面板 */
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
        }
        .stat-item {
            font-size: 14px;
            color: #475569;
        }
        .stat-item span {
            font-weight: bold;
            color: var(--primary);
            font-size: 16px;
        }

        /* 表格樣式 */
        .table-responsive {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
            white-space: nowrap;
        }
        th, td {
            border-bottom: 1px solid var(--border-color);
            padding: 12px 10px;
            vertical-align: middle;
        }
        th {
            background-color: #f8fafc;
            color: #475569;
            text-align: center;
            font-weight: 600;
        }
        td.highlight-col {
            background-color: #fefce8;
            font-weight: 500;
        }
        input[type="text"], textarea, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
        }
        textarea { height: 60px; resize: vertical; }
        input:focus, textarea:focus, select:focus {
            outline: 2px solid var(--primary);
            border-color: transparent;
        }

        /* 按鈕樣式 */
        .btn {
            padding: 8px 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-add { background-color: var(--success); }
        .btn-add:hover { background-color: #15803d; }
        .btn-save { background-color: var(--primary); font-size: 15px; padding: 10px 24px; margin-top: 15px; }
        .btn-save:hover { background-color: var(--primary-dark); }
        .btn-del { background-color: var(--danger); padding: 6px 12px; font-size: 12px; }
        .btn-del:hover { background-color: #b91c1c; }
        .btn-tool { background-color: #64748b; font-size: 13px; padding: 6px 12px; }
        .btn-tool:hover { background-color: #475569; }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .filter-bar { display: flex; gap: 10px; flex: 1; }
        .search-box, .filter-select { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; }
        .search-box { width: 260px; }
        
        .msg { margin-left: 10px; color: var(--success); font-weight: bold; font-size: 14px; }
        .badge {
            background-color: #e0f2fe; color: #0369a1; padding: 4px 10px;
            border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block;
        }
    </style>
</head>
<body>

    <header>
        <h2>💼 專業版業務案件記錄系統</h2>
        <div class="nav-btns">
            <button id="btn-frontend" class="active" onclick="switchView('frontend')">前台總覽</button>
            <button id="btn-backend" onclick="checkPasswordAndSwitch()">後台管理</button>
        </div>
    </header>

    <div class="container">
        <!-- ================= 前台檢視介面 ================= -->
        <div id="frontend-view" class="view-section active">
            <div class="toolbar">
                <div class="filter-bar">
                    <select id="filterCategory" class="filter-select" onchange="updateFilterAndRender()">
                        <option value="">全部分類</option>
                    </select>
                    <input type="text" id="searchInput" class="search-box" placeholder="🔍 搜尋案名、編號或內容..." onkeyup="renderFrontend()">
                </div>
            </div>

            <!-- 數據統計欄 -->
            <div class="stats-bar">
                <div class="stat-item">符合條件案件數：<span id="stat-count">0</span> 筆</div>
                <div class="stat-item">委外費用加總：<span id="stat-cost">0</span></div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 10%;">分類</th>
                            <th style="width: 8%;">業務編號</th>
                            <th style="width: 25%;">案名</th>
                            <th style="width: 20%;">工作內容</th>
                            <th style="width: 10%;">委外費用</th>
                            <th style="width: 13%;">說明</th>
                            <th style="width: 14%;">備註</th>
                        </tr>
                    </thead>
                    <tbody id="frontend-tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- ================= 後台管理介面 ================= -->
        <div id="backend-view" class="view-section">
            <div class="toolbar">
                <button class="btn btn-add" onclick="addBackendRow()">+ 新增案件</button>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-tool" onclick="exportData()">📥 備份匯出資料</button>
                    <label class="btn btn-tool" style="cursor: pointer; margin: 0;">
                        📤 還原匯入資料 <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
                    </label>
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 12%;">分類 (可直接修改)</th>
                            <th style="width: 8%;">業務編號</th>
                            <th style="width: 22%;">案名</th>
                            <th style="width: 18%;">工作內容</th>
                            <th style="width: 10%;">委外費用</th>
                            <th style="width: 13%;">說明</th>
                            <th style="width: 13%;">備註</th>
                            <th style="width: 4%;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="backend-tbody"></tbody>
                </table>
            </div>

            <div style="display: flex; align-items: center;">
                <button class="btn btn-save" onclick="saveBackendData()">💾 儲存所有變更</button>
                <span id="save-msg" class="msg"></span>
            </div>
        </div>
    </div>

<script>
    // 🔐 在這裡設定您的後台密碼（預設為 1234，您可以直接在這裡修改成想要的密碼）
    const ADMIN_PASSWORD = "1234";
    let isAuthorized = false;

    function getData() {
        const saved = localStorage.getItem('project_pwd_system_data');
        return saved ? JSON.parse(saved) : [
            { category: "設計監造", no: "", name: "臺中市神岡公有市場", content: "投標現勘、現調查記錄圖、監造", cost: "", desc: "", remark: "" }
        ];
    }

    // 點擊後台時先驗證密碼
    function checkPasswordAndSwitch() {
        if (!isAuthorized) {
            let pwd = prompt("請輸入後台管理密碼：");
            if (pwd === null) return; // 按取消
            if (pwd === ADMIN_PASSWORD) {
                isAuthorized = true;
                switchView('backend');
            } else {
                alert("❌ 密碼錯誤，無法進入後台！");
                return;
            }
        } else {
            switchView('backend');
        }
    }

    function switchView(view) {
        document.getElementById('frontend-view').classList.remove('active');
        document.getElementById('backend-view').classList.remove('active');
        document.getElementById('btn-frontend').classList.remove('active');
        document.getElementById('btn-backend').classList.remove('active');

        if (view === 'frontend') {
            document.getElementById('frontend-view').classList.add('active');
            document.getElementById('btn-frontend').classList.add('active');
            updateCategoryDropdown();
            renderFrontend();
        } else {
            document.getElementById('backend-view').classList.add('active');
            document.getElementById('btn-backend').classList.add('active');
            renderBackend();
        }
    }

    function updateCategoryDropdown() {
        const data = getData();
        const select = document.getElementById('filterCategory');
        const currentValue = select.value;
        const categories = [...new Set(data.map(i => i.category ? i.category.trim() : '未分類'))];
        
        let html = '<option value="">全部分類</option>';
        categories.forEach(cat => {
            html += `<option value="${cat}">${cat}</option>`;
        });
        select.innerHTML = html;
        select.value = currentValue;
    }

    function updateFilterAndRender() {
        renderFrontend();
    }

    function renderFrontend() {
        const data = getData();
        const tbody = document.getElementById('frontend-tbody');
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        const selectedCat = document.getElementById('filterCategory').value;
        tbody.innerHTML = '';

        const filtered = data.filter(i => {
            const cat = i.category ? i.category.trim() : '未分類';
            const matchCat = (selectedCat === "" || cat === selectedCat);
            const matchKey = (i.name.toLowerCase().includes(keyword) || 
                              i.no.toLowerCase().includes(keyword) || 
                              i.content.toLowerCase().includes(keyword));
            return matchCat && matchKey;
        });

        let totalCostSum = 0;

        filtered.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="text-align:center;"><span class="badge">${item.category || '未分類'}</span></td>
                <td style="text-align:center;">${item.no}</td>
                <td><b>${item.name}</b></td>
                <td>${item.content}</td>
                <td class="highlight-col" style="text-align:right;">${item.cost}</td>
                <td>${item.desc}</td>
                <td style="white-space: pre-line;">${item.remark}</td>
            `;
            tbody.appendChild(tr);

            let num = parseFloat(item.cost.replace(/[^\d.-]/g, ''));
            if (!isNaN(num)) totalCostSum += num;
        });

        document.getElementById('stat-count').innerText = filtered.length;
        document.getElementById('stat-cost').innerText = totalCostSum > 0 ? totalCostSum.toLocaleString() + ' 元 (估算)' : '無數值或未填';
    }

    function renderBackend() {
        const data = getData();
        const tbody = document.getElementById('backend-tbody');
        tbody.innerHTML = '';
        data.forEach(item => appendBackendRow(item));
    }

    function appendBackendRow(item = {category:'設計監造', no:'', name:'', content:'', cost:'', desc:'', remark:''}) {
        const tbody = document.getElementById('backend-tbody');
        const tr = document.createElement('tr');
        
        tr.innerHTML = `
            <td><input type="text" class="b-category" value="${item.category || ''}" placeholder="輸入分類名稱"></td>
            <td><input type="text" class="b-no" value="${item.no}" style="text-align:center;"></td>
            <td><textarea class="b-name">${item.name}</textarea></td>
            <td><textarea class="b-content">${item.content}</textarea></td>
            <td><input type="text" class="b-cost highlight-col" value="${item.cost}" style="text-align:right;"></td>
            <td><textarea class="b-desc">${item.desc}</textarea></td>
            <td><textarea class="b-remark">${item.remark}</textarea></td>
            <td style="text-align:center;"><button class="btn btn-del" onclick="this.closest('tr').remove()">刪除</button></td>
        `;
        tbody.appendChild(tr);
    }

    function addBackendRow() { appendBackendRow(); }

    function saveBackendData() {
        const newData = Array.from(document.querySelectorAll('#backend-tbody tr')).map(row => ({
            category: row.querySelector('.b-category').value.trim(),
            no: row.querySelector('.b-no').value.trim(),
            name: row.querySelector('.b-name').value.trim(),
            content: row.querySelector('.b-content').value.trim(),
            cost: row.querySelector('.b-cost').value.trim(),
            desc: row.querySelector('.b-desc').value.trim(),
            remark: row.querySelector('.b-remark').value.trim()
        }));
        localStorage.setItem('project_pwd_system_data', JSON.stringify(newData));
        
        const msg = document.getElementById('save-msg');
        msg.innerText = '✔ 儲存成功！';
        setTimeout(() => msg.innerText = '', 2500);
    }

    function exportData() {
        const data = localStorage.getItem('project_pwd_system_data') || '[]';
        const blob = new Blob([data], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `project_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const json = JSON.parse(e.target.result);
                localStorage.setItem('project_pwd_system_data', JSON.stringify(json));
                renderBackend();
                alert('✔ 資料還原成功！');
            } catch (err) {
                alert('❌ 檔案格式錯誤，無法還原。');
            }
        };
        reader.readAsText(file);
    }

    window.onload = function() {
        updateCategoryDropdown();
        renderFrontend();
    };
</script>
</body>
</html>
